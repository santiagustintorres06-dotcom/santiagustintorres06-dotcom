  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58e7b2"/><stop offset="1" stop-color="#8b83ff"/></linearGradient>
  <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M27 0H0V27" fill="none" stroke="#344364" stroke-width="0.7" opacity=".32"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" /></filter>
</defs>
