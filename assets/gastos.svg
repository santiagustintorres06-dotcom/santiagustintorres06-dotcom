<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Diagram of the family expense organizer showing spreadsheet and calendar views connecting to PySide6 service and SQLite persistence layers">
<defs>
